<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión · MedPortal</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="login_style.css">

 
  <script src="iconos.js"></script>
  <script src="storage.js"></script>
  <script src="ui.js"></script>
  <script src="sesion.js"></script>
  <script src="login.js"></script>
</head>


<body>
  <div class="login-container">

    <div class="login__marca">
      <span class="login__escudo" data-icono="shield" data-tam="28"></span>
      <h1 class="login__titulo">MedPortal</h1>
    </div>

    <section class="tarjeta login__tarjeta">
      <form novalidate>
        <div>
          <h2 class="login__bienvenida">Bienvenido de nuevo</h2>
                </div>

        <div class="campo" id="campo-username">
          <label class="campo__label" for="username">Nombre de usuario</label>
          <div class="campo__caja campo__caja--hundida">
            <span data-icono="circle-user"></span>
            <input type="text" id="username" name="username" placeholder="Ingrese ID de admin"
                   autocomplete="username" required>
          </div>
          <p class="campo__error" id="error-username" role="alert"></p>
        </div>

        <div class="campo" id="campo-password">
          <label class="campo__label" for="password">Contraseña</label>
          <div class="campo__caja campo__caja--hundida">
            <span data-icono="lock"></span>
            <input type="password" id="password" name="password" placeholder="••••••••"
                   autocomplete="current-password" required>
            <button type="button" id="ver-password" aria-label="Mostrar contraseña" aria-pressed="false"
                    data-icono="eye"></button>
          </div>
          <p class="campo__error" id="error-password" role="alert"></p>
        </div>

        <!-- Error de credenciales: reemplaza al alert() de la cátedra -->
        <p class="login__aviso" id="aviso-login" role="alert" hidden></p>

        <button type="submit" class="boton boton--bloque login__enviar">
          Iniciar Sesión <span data-icono="log-out"></span>
        </button>
      </form>

      
    </section>

  </div>
</body>
</html>
